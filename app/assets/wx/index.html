<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>昕达控制器</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="app">
  <div id="navbar"><div id="nav-title">昕达控制器</div></div>
  <div id="page-area">
    <div id="pages"></div>
    <div id="ptr"><div class="ptr-spinner"></div></div>
  </div>
  <div id="tabbar"></div>
</div>

<div id="wx-toast" class="wx-overlay" hidden>
  <div class="wx-toast-box">
    <div class="wx-toast-icon"></div>
    <div class="wx-toast-text"></div>
  </div>
</div>

<div id="wx-modal" class="wx-overlay" hidden>
  <div class="wx-mask"></div>
  <div class="wx-modal">
    <div class="wx-modal-title"></div>
    <div class="wx-modal-content"></div>
    <input class="wx-modal-input" type="text">
    <div class="wx-modal-actions">
      <button class="wx-modal-cancel" type="button">取消</button>
      <button class="wx-modal-confirm" type="button">确定</button>
    </div>
  </div>
</div>

<div id="wx-sheet" class="wx-overlay" hidden>
  <div class="wx-mask"></div>
  <div class="wx-sheet">
    <div class="wx-sheet-header">
      <span class="wx-sheet-cancel">取消</span>
      <span class="wx-sheet-title"></span>
      <span class="wx-sheet-done">确定</span>
    </div>
    <div class="wx-sheet-body"></div>
  </div>
</div>

<script>
window.__wxAppCode__ = {};
window.__WXML_GLOBAL__ = {};
window.__wxAppData__ = {};
window.__wxRoute = '';
window.__wxRouteBegin = false;
window.__vd_version_info__ = {};
window.__transformRpx__ = function (n) { return n / 7.5; };
window.__convertRpxToVw__ = true;
window.__mainPageFrameReady__ = function () { window.__pageFrameReady__ = true; };
</script>
<script src="js/runtime.js"></script>
<script src="js/app-service.js"></script>
<script src="js/page-frame.js"></script>
<script>window.__boot__();</script>
</body>
</html>
